name: Set up a plugin job
description: Node with the plugin's npm cache, and the bb CLI that `bb plugin build` needs.
inputs:
  plugin:
    description: Folder name under plugins/.
    required: true
  bb-version:
    description: >-
      Version of the npm package bb-app, which ships the bb CLI. Empty picks
      the bb release that ships the SDK the plugin pins (@get-bb/plugin-sdk);
      the Compatibility workflow passes newer ones.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: plugins/${{ inputs.plugin }}/package-lock.json
    # The build needs no bb server; install scripts only build native modules
    # the build never loads.
    - name: Install the bb CLI
      shell: bash
      env:
        BB_VERSION: ${{ inputs.bb-version }}
        PLUGIN: ${{ inputs.plugin }}
      run: |
        if [[ -z $BB_VERSION ]]; then
          sdk=$(jq -r '.devDependencies["@get-bb/plugin-sdk"]' "plugins/$PLUGIN/package.json")
          # The bb release whose `bb plugin types` reports each SDK pin. A
          # plugin repinned to an SDK missing here fails until it is added.
          case $sdk in
            0.5.9) BB_VERSION=0.43.4 ;;
            0.5.29) BB_VERSION=0.44.0 ;;
            *) echo "::error::$PLUGIN pins @get-bb/plugin-sdk $sdk, which no bb release is listed for in .github/actions/setup/action.yml" >&2; exit 1 ;;
          esac
        fi
        echo "bb-app $BB_VERSION for $PLUGIN"
        npm install --global --ignore-scripts --no-audit --no-fund "bb-app@$BB_VERSION"
